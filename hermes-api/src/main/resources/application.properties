quarkus.datasource.db-kind=postgresql 
quarkus.datasource.username=${DB_USERNAME:hermes}
quarkus.datasource.password=${DB_PASSWORD:pass_hermes}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hermes}
# Raised from 2: the dashboard polls aggregates on the same datasource as the ingest path.
quarkus.datasource.jdbc.max-size=8
quarkus.hibernate-orm.database.default-schema=hermes
quarkus.transaction-manager.default-transaction-timeout=4s
quarkus.http.port=8080
quarkus.redis.hosts=redis://${CACHE_HOST:localhost}:${CACHE_PORT:6379}
# Operator console: which broker is running and where its management API lives.
hermes.broker.kind=${BROKER_KIND:artemis}
hermes.broker.host=${BROKER_HOST:localhost}
hermes.broker.management-port=${BROKER_MGMT_PORT:8161}
hermes.broker.username=${MQ_USERNAME:hermes}
hermes.broker.password=${MQ_PASSWORD:pass_hermes}
hermes.enqueuer.url=${ENQUEUER_URL:http://localhost:8082}
