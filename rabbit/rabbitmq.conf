# This file mirrors the role of artemis/broker.xml: it configures the
# broker (queues, exchanges, users and permissions) via a definitions
# import instead of inline configuration.
#
# AMQP 1.0 is native in RabbitMQ 4.x, so no plugin needs to be enabled here.
load_definitions = /etc/rabbitmq/definitions.json

# RabbitMQ does not see its own container limit here, and that is what killed it.
#
# Under Docker Desktop it reads the VM's RAM, not the cgroup: with a 512 MiB limit it logged
# "Memory high watermark set to 4761 MiB of 7936 MiB total" and put its flow control 9.3x above
# the point where Linux kills the process. Back-pressure could never engage, so a load test that
# queued 390k messages ended in exit 137 — OOMKilled — rather than in blocked publishers.
#
# Telling it the real number is what restores the safety valve: at the watermark RabbitMQ blocks
# publishers, the enqueuer's ack timeout fires, the chunk is rolled back and retried on the next
# tick. Slow instead of dead, and nothing is lost.
#
# This value must match the container's memory limit. Both paths give the broker 1 GiB:
# `deploy.resources` in docker-compose.yml and `--memory` in rabbit/Makefile. Change one and you
# must change all three.
total_memory_available_override_value = 1GB

# 0.4 of 1 GiB leaves room for the Erlang runtime itself above the watermark, which is the point:
# the alarm has to fire while there is still headroom to act on it.
vm_memory_high_watermark.relative = 0.4
