quarkus.datasource.db-kind=postgresql 
quarkus.datasource.username=${DB_USERNAME:hermes}
quarkus.datasource.password=${DB_PASSWORD:pass_hermes}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hermes}
quarkus.datasource.jdbc.max-size=2
quarkus.hibernate-orm.database.default-schema=hermes
# The chunk transaction now waits for broker acks (see AbstractMailWriter), so it needs
# headroom above hermes.enqueuer.ack-timeout-seconds.
quarkus.transaction-manager.default-transaction-timeout=30s
# Waited for by AmqpRecipientPublisher before the chunk records anything. Must stay
# below the transaction timeout above, or the transaction expires first and the
# failure is reported as the wrong thing.
hermes.enqueuer.ack-timeout-seconds=${ENQUEUER_ACK_TIMEOUT:10}
quarkus.http.port=8082
#Message configuration
mp.messaging.outgoing.mail-requests.connector=smallrye-amqp
mp.messaging.outgoing.mail-requests.durable=true
mp.messaging.outgoing.mail-requests.address=${MQ_MAIL_ADDRESS:jms.queue.MailQueue}
amqp-host=${MQ_HOST:localhost}
amqp-port=${MQ_PORT:5672}
amqp-username=${MQ_USERNAME:hermes}
amqp-password=${MQ_PASSWORD:pass_hermes}
# Cap divided by scheduler interval is a ceiling on how fast the enqueuer can publish:
# 100000 / 30s is about 3300/s. That is well above what the consumer drains (~1200/s with one
# mailer, ~2300/s with two), so the enqueuer is not the bottleneck — measured on its own it
# reaches ~4400/s. What this number really governs is memory: the reader loads that many
# entities in one go, and at 100000 the enqueuer sits at ~690 MiB of its 1 GiB.
hermes.enqueuer.max-recipients-per-run=${ENQUEUER_MAX_RECIPIENTS:100000}
hermes.enqueuer.interval=${ENQUEUER_INTERVAL:30s}
