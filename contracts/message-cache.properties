# A chave e o TTL do cache de Message no Redis.
#
# A api escreve, o mailer le. Os dois tinham estes dois valores como literais no proprio
# arquivo: String.format("message_%d", id) e TTL_IN_SECONDS = "30", em MessageService dos
# dois modulos. Sao os mesmos dois valores; agora sao a mesma linha.
key.format=message_%d
ttl.seconds=30
